<head>
<meta charset="utf-8">

<title>BBC</title>
<style>
:root{--g:#4ade80;--tx:#f1f5ff;--mu:#9fb0d0;--ok:#4ade80;--no:#fb7185;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{min-height:100%;background:#0b1224}
body{margin:0;min-height:100vh;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(160deg,#0b1224 0%,#142a5c 55%,#1f4fa8 100%);background-attachment:fixed}
.w{max-width:520px;margin:0 auto;padding:18px 16px 32px}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo i{width:44px;height:44px;border-radius:12px;background:var(--g);color:#0b1224;font:700 24px system-ui;display:grid;place-items:center;font-style:normal}
.logo b{font-size:20px;display:block}.logo span{font-size:12px;color:var(--mu)}
.box{background:rgba(10,16,36,.55);border:1px solid rgba(140,170,255,.25);border-radius:22px;padding:20px 16px}
.eyebrow{color:var(--g);font-size:12px;font-weight:700;letter-spacing:.14em;text-align:center}
h1{font-size:30px;line-height:1.15;text-align:center;margin:10px 0 12px}
.lead{color:var(--mu);text-align:center;font-size:14px;margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.stats div{background:rgba(255,255,255,.06);border:1px solid rgba(140,170,255,.2);border-radius:12px;padding:10px 4px;text-align:center}
.stats b{display:block;color:var(--g);font-size:20px}.stats small{font-size:12px;color:var(--mu)}
h2{font-size:16px;margin:0 0 10px}
button{font:inherit;color:inherit;cursor:pointer}
.ders{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:rgba(40,70,140,.45);border:1px solid rgba(140,170,255,.3);border-radius:16px;padding:14px;margin-bottom:10px}
.ders em{font-style:normal;font-size:24px;width:42px;height:42px;display:grid;place-items:center;background:rgba(255,255,255,.1);border-radius:10px}
.ders span{flex:1}.ders b{display:block;font-size:15px}.ders small{color:var(--mu)}
.note{text-align:center;color:var(--mu);font-size:12px;margin-top:14px}
.top{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);margin-bottom:8px}
.bar{height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--g);transition:width .3s}
.q{font-size:18px;font-weight:600;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;padding:13px;margin-bottom:8px;background:rgba(40,70,140,.45);border:1.5px solid rgba(140,170,255,.3);border-radius:12px;font-size:15px}
.opt.ok{border-color:var(--ok);background:rgba(74,222,128,.2)}
.opt.no{border-color:var(--no);background:rgba(251,113,133,.2)}
.exp{margin-top:10px;padding:12px;border-radius:12px;background:rgba(255,255,255,.08);font-size:14px}
.main{display:block;width:100%;padding:14px;margin-top:12px;border:0;border-radius:12px;background:var(--g);color:#0b1224;font-weight:700;font-size:16px}
.ghost{background:transparent;color:var(--tx);border:1.5px solid rgba(140,170,255,.4)}
.big{font-size:52px;font-weight:800;text-align:center;color:var(--g);margin:10px 0}
.c{text-align:center}
</style>
</head>

<div class="logo"><i>B</i><div><b>BBC</b><span>Soru çöz, pekiştir</span></div></div>

["Koşula göre farklı yol seçmeyi sağlayan yapı hangisidir?",["Karar (if) yapısı","Dizi","Sabit","Yorum"],0,"if, koşula göre dallanmayı sağlar."],

["Bir sayının çift olup olmadığı hangi işlemle anlaşılır?",["2'ye bölümünden kalana bakılarak","Karekökü alınarak","Toplanarak","Yazdırılarak"],0,"sayı % 2 == 0 ise çifttir."]
]];
X.forEach((e,i)=>D[i].q.push(...e));
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const A=document.getElementById('app');let S={};
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function home(){const t=D.reduce((s,d)=>s+d.q.length,0);
let h=`<div class="eyebrow">VİZE HAZIRLIK UYGULAMASI</div><h1>Bilgini test et.<br>Vizeye hazır ol.</h1><p class="lead">Dersini seç, soruları çöz, doğru ve yanlışlarını gör. İstediğin zaman tekrar deneyebilirsin.</p><div class="stats"><div><b>${D.length}</b><small>Ders</small></div><div><b>${t}</b><small>Soru</small></div><div><b>Ücretsiz</b><small>Kullanım</small></div></div><h2>Dersini seç</h2>`;
D.forEach((d,i)=>h+=`<button class="ders" onclick="start(${i})"><em>${d.ic}</em><span><b>${d.ad}</b><small>${d.q.length} soru</small></span>›</button>`);
h+='<div class="note">Cevap verdikten sonra doğru yanıtı ve açıklamasını görebilirsin.</div>';A.innerHTML=h}
function start(i){const q=sh(D[i].q).map(c=>{const o=c[1].map((t,k)=>[t,k===c[2]]);const m=sh(o);return[c[0],m.map(x=>x[0]),m.findIndex(x=>x[1]),c[3]]});S={i,q,n:0,p:0,a:false};show()}
function show(){const{q,n}=S;if(n>=q.length)return end();const c=q[n];
let h=`<div class="top"><span>${D[S.i].ad}</span><span>${n+1}/${q.length}</span></div><div class="bar"><i style="width:${n/q.length*100}%"></i></div><div class="q">${esc(c[0])}</div>`;
c[1].forEach((o,k)=>h+=`<button class="opt" id="o${k}" onclick="pick(${k})">${'ABCD'[k]}) ${esc(o)}</button>`);
h+='<div id="ex"></div><button class="main ghost" onclick="home()">Derslere dön</button>';A.innerHTML=h}
function pick(k){if(S.a)return;S.a=true;const c=S.q[S.n];if(k===c[2])S.p++;
document.getElementById('o'+c[2]).classList.add('ok');if(k!==c[2])document.getElementById('o'+k).classList.add('no');
document.getElementById('ex').innerHTML=`<div class="exp">${k===c[2]?'✅ Doğru!':'❌ Yanlış.'} ${esc(c[3])}</div><button class="main" onclick="next()">${S.n+1>=S.q.length?'Sonucu gör':'Sonraki soru'}</button>`}
function next(){S.n++;S.a=false;show()}
function end(){const t=S.q.length;A.innerHTML=`<div class="c"><div>Sonuç</div><div class="big">${S.p}/${t}</div><div>${S.p===t?'Harika! 🎉':S.p>=t/2?'İyi gidiyorsun 👍':'Tekrar çözmeye devam 💪'}</div></div><button class="main" onclick="start(${S.i})">Tekrar çöz</button><button class="main ghost" onclick="home()">Derslere dön</button>`}
home();
</script>
